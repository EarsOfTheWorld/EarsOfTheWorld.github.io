const selected = new Set();

function formatTime(t) {
  const h = parseInt(t.slice(0,2));
  const m = t.slice(2,4);
  const ampm = h < 12 ? 'a.m.' : 'p.m.';
  const h12 = h % 12 || 12;
  return m === '00' ? `${h12}:00 ${ampm}` : `${h12}:${m} ${ampm}`;
}

function updateButton() {
  const n = selected.size;
  const label = n === 0
    ? 'No events selected'
    : `Add ${n} event${n === 1 ? '' : 's'} to Calendar`;
  ['export-btn-end', 'export-btn-sticky'].forEach(id => {
    const btn = document.getElementById(id);
    btn.textContent = label;
    btn.disabled = n === 0;
  });
}

function toggleEvent(idx, el) {
  const checked = el.getAttribute('aria-checked') === 'true';
  const nowChecked = !checked;
  el.setAttribute('aria-checked', nowChecked ? 'true' : 'false');
  const card = document.getElementById(`event-${idx}`);
  if (nowChecked) {
    selected.add(idx);
    card.classList.add('selected');
  } else {
    selected.delete(idx);
    card.classList.remove('selected');
  }
  updateButton();
}

function buildPage() {
  const main = document.getElementById('main');
  const days = [...new Set(EVENTS.map(e => e.day))];

  days.forEach(day => {
    const section = document.createElement('section');
    section.className = 'day-section';

    const dayH1 = document.createElement('h1');
    dayH1.className = 'day-heading';
    dayH1.textContent = day;
    section.appendChild(dayH1);

    EVENTS.forEach((ev, idx) => {
      if (ev.day !== day) return;

      const card = document.createElement('div');
      card.className = 'event';
      card.id = `event-${idx}`;

      // h2 with role=checkbox — VoiceOver reads title + checkbox state together
      const title = document.createElement('h2');
      title.className = 'event-title';
      title.setAttribute('role', 'checkbox');
      title.setAttribute('aria-checked', 'false');
      title.setAttribute('aria-label', ev.title);
      title.setAttribute('tabindex', '0');

      // Visible checkmark for sighted users when checked
      const checkMark = document.createElement('span');
      checkMark.className = 'check-mark';
      checkMark.setAttribute('aria-hidden', 'true');
      title.appendChild(checkMark);

      // Title text
      const titleText = document.createTextNode(ev.title);
      title.appendChild(titleText);

      // Toggle on click/tap
      title.addEventListener('click', () => toggleEvent(idx, title));
      // Toggle on Space or Enter for keyboard users
      title.addEventListener('keydown', e => {
        if (e.key === ' ' || e.key === 'Enter') {
          e.preventDefault();
          toggleEvent(idx, title);
        }
      });

      card.appendChild(title);

      // Meta info — time, room, description, presenters
      const meta = document.createElement('div');
      meta.className = 'event-meta';

      const time = document.createElement('p');
      time.className = 'event-time';
      time.textContent = formatTime(ev.start) + '–' + formatTime(ev.end);
      meta.appendChild(time);

      const room = document.createElement('p');
      room.className = 'event-room';
      room.innerHTML = `<strong>Room:</strong> ${ev.room}`;
      meta.appendChild(room);

      const desc = document.createElement('p');
      desc.className = 'event-desc';
      desc.textContent = ev.desc;
      meta.appendChild(desc);

      if (ev.pres) {
        const pres = document.createElement('p');
        pres.className = 'event-pres';
        pres.textContent = ev.pres;
        meta.appendChild(pres);
      }

      card.appendChild(meta);
      section.appendChild(card);
    });

    main.appendChild(section);
  });
}

function makeICS() {
  const sorted = [...selected].sort((a, b) => {
    const ea = EVENTS[a], eb = EVENTS[b];
    return (ea.date + ea.start).localeCompare(eb.date + eb.start);
  });

  const esc = s => s.replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');
  const now = new Date().toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';

  const vevents = sorted.map(idx => {
    const ev = EVENTS[idx];
    return [
      'BEGIN:VEVENT',
      `UID:nfb2026-${ev.date}-${ev.start}-${idx}@nfb26`,
      `DTSTAMP:${now}`,
      `DTSTART:${ev.date}T${ev.start}Z`,
      `DTEND:${ev.date}T${ev.end}Z`,
      `SUMMARY:${esc(ev.title)}`,
      `LOCATION:${esc(ev.room + ', JW Marriott Austin, TX')}`,
      `DESCRIPTION:${esc(ev.desc + (ev.pres ? '\n\n' + ev.pres : ''))}`,
      'END:VEVENT'
    ].join('\r\n');
  });

  return [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//NFB2026//Eric Agenda//EN',
    'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH',
    ...vevents,
    'END:VCALENDAR'
  ].join('\r\n');
}

function exportICS() {
  const blob = new Blob([makeICS()], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'nfb2026_eric_agenda.ics';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  const t = document.getElementById('toast');
  t.textContent = `Downloaded ${selected.size} event${selected.size === 1 ? '' : 's'} — open nfb2026_eric_agenda.ics to import`;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 4000);
}

document.getElementById('export-btn-end').addEventListener('click', exportICS);
document.getElementById('export-btn-sticky').addEventListener('click', exportICS);

buildPage();
updateButton();
</script>
